consciousness_deep_dive_planned_run_pc:
  meta:
    role: user_task
    domain: 活动玩法
    title: 识海深潜关卡内自动运行
    description: 通过桥接器读取三至五阶棋盘，优先提高期限内遇到奇点的概率，概率相同时争取更多灵感。战前缺员时从候补补全，人数不足时结束下潜。
    entry_point: true
    inputs:
      - {name: strategy, type: string, default: encounter_then_inspiration}
      - {name: safety_round_limit, type: number, default: 100, min: 1, max: 100}
      - {name: scan_time_budget_sec, type: number, default: 300, min: 5, max: 900}
      - {name: scan_route, type: enum, default: cells, enum: [cells, faces, mixed, vertices, target_cells, target_faces, target_framed, four_views]}
      - {name: planning_time_budget_sec, type: number, default: 0.35, min: 0.1, max: 300}
      - name: interval_policy
        type: dict
        default: {}
        properties:
          order:
            name: order
            type: list
            count: 4
            item: {name: operation, type: enum, enum: [revive, intensify, awake, recruit]}
          revive:
            name: revive
            type: dict
            properties:
              enabled: {name: enabled, type: boolean}
              limit: {name: limit, type: number, strict_integer: true, min: 0, max: 2147483647}
          intensify:
            name: intensify
            type: dict
            properties:
              enabled: {name: enabled, type: boolean}
              limit: {name: limit, type: number, strict_integer: true, min: 0, max: 2147483647}
              recommended_only: {name: recommended_only, type: boolean}
              order: {name: order, type: enum, enum: [low, high]}
          awake:
            name: awake
            type: dict
            properties:
              enabled: {name: enabled, type: boolean}
              limit: {name: limit, type: number, strict_integer: true, min: 0, max: 2147483647}
              mode: {name: mode, type: enum, enum: [focused, even]}
              max_level: {name: max_level, type: number, strict_integer: true, min: 1, max: 5}
          recruit:
            name: recruit
            type: dict
            properties:
              enabled: {name: enabled, type: boolean}
              limit: {name: limit, type: number, strict_integer: true, min: 0, max: 2147483647}
              order: {name: order, type: enum, enum: [low, high]}
          fill_party: {name: fill_party, type: boolean}
          fixed_party: {name: fixed_party, type: boolean}
      - {name: battle_retry_limit, type: number, default: 0, strict_integer: true, min: 0}
      - name: shop_policy
        type: dict
        default: {}
        properties:
          enabled: {name: enabled, type: boolean}
          recommended_only: {name: recommended_only, type: boolean}
          order: {name: order, type: enum, enum: [low, high]}
          limit: {name: limit, type: number, strict_integer: true, min: 0, max: 2147483647}
      - name: event_option_policy
        type: list
        default: []
        item:
          name: event
          type: dict
          properties:
            name: {name: name, type: string, required: true}
            order:
              name: order
              type: list
              item: {name: option_id, type: number, strict_integer: true, min: 1, max: 2147483647}
            disabled:
              name: disabled
              type: list
              item: {name: option_id, type: number, strict_integer: true, min: 1, max: 2147483647}
  steps:
    require_bridge:
      action: resonance_pc.require_deep_dive_bridge
      params:
        require_turn: true
        require_actions: true
        require_choices: true
        require_interval: true
        require_battle_retry: "{{ inputs.battle_retry_limit > 0 }}"
        require_shop: "{{ inputs.shop_policy.enabled | default(true) }}"
    initialize:
      depends_on: require_bridge
      action: resonance_pc.deep_dive_planned_run_initialize
      timeout: -1
      params:
        strategy: "{{ inputs.strategy }}"
        safety_round_limit: "{{ inputs.safety_round_limit }}"
        scan_time_budget_sec: "{{ inputs.scan_time_budget_sec }}"
        scan_route: "{{ inputs.scan_route }}"
        planning_time_budget_sec: "{{ inputs.planning_time_budget_sec }}"
        interval_policy: "{{ inputs.interval_policy | default({}) }}"
        battle_retry_limit: "{{ inputs.battle_retry_limit | default(0) }}"
        shop_policy: "{{ inputs.shop_policy | default({}) }}"
        event_option_policy: "{{ inputs.event_option_policy | default([]) }}"
    advance:
      action: resonance_pc.deep_dive_planned_run_advance
      timeout: -1
      depends_on: initialize
      loop:
        while: "{{ state[nodes.initialize.output.session_key].status == 'running' }}"
        max_iterations: "{{ inputs.safety_round_limit * 2400 + 2000 }}"
      params:
        session_key: "{{ nodes.initialize.output.session_key }}"
    finish:
      action: resonance_pc.deep_dive_planned_run_finish
      timeout: -1
      depends_on: advance
      params:
        session_key: "{{ nodes.initialize.output.session_key }}"
  returns:
    deep_dive_planned_run: "{{ nodes.finish.output }}"
